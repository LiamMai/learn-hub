<div class="p-8 max-w-[1200px] mx-auto w-full space-y-6">
  <div class="flex items-center gap-2 text-sm text-outline">
    <a routerLink="/" class="hover:text-primary transition-colors">Home</a>
    <span>/</span>
    <span class="text-on-surface font-bold">Interview Preparation</span>
  </div>

  <div>
    <h1 class="text-2xl font-bold text-on-surface">Interview Preparation</h1>
    <p class="text-on-surface-variant text-sm">
      Practice real questions, filtered by difficulty.
    </p>
  </div>

  <div class="flex flex-col sm:flex-row gap-3 sm:items-center sm:justify-between">
    <app-filter-chip-group
      [options]="difficultyOptions"
      [selected]="selectedDifficulty()"
      (selectedChange)="selectedDifficulty.set($event); onDifficultyChange()"
    />
    <div class="relative w-full sm:w-72">
      <span
        class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]"
        >search</span
      >
      <input
        class="w-full pl-10 pr-4 py-2 bg-surface-container rounded-full border-none focus:ring-2 focus:ring-primary transition-all text-sm"
        placeholder="Search questions..."
        type="text"
        [value]="search()"
        (input)="onSearch($any($event.target).value)"
      />
    </div>
  </div>

  @if (loading()) {
    <p class="text-on-surface-variant">Loading questions&hellip;</p>
  } @else if (error()) {
    <p class="text-error">{{ error() }}</p>
  } @else if (total() === 0) {
    <app-empty-state
      icon="quiz"
      title="No questions match your filters"
      description="Try a different search term or difficulty."
    />
  } @else {
    <div class="bg-surface-container-lowest border border-surface-variant rounded-2xl p-2">
      <app-data-table [columns]="columns" [rows]="pagedRows()">
        <ng-template #row let-q>
          <td class="py-3 px-4">
            <p class="font-bold text-on-surface">{{ q.question }}</p>
          </td>
          <td class="py-3 px-4">
            <app-pill
              [label]="difficultyMeta(q).label"
              [color]="difficultyMeta(q).color"
            />
          </td>
          <td class="py-3 px-4 text-sm text-outline">
            {{ q.followUps.length }}
          </td>
          <td class="py-3 px-4 text-right">
            <span class="material-symbols-outlined text-outline">arrow_forward</span>
          </td>
        </ng-template>
      </app-data-table>
    </div>

    <app-pagination
      [page]="page()"
      [pageSize]="10"
      [total]="total()"
      (pageChange)="page.set($event)"
    />
  }
</div>
