<aside
  class="flex flex-col h-screen w-64 fixed left-0 top-0 border-r border-surface-variant bg-surface-container-lowest z-40"
>
  <div class="px-6 py-8">
    <h1 class="text-2xl font-bold text-primary font-display">DevHub</h1>
    <p class="text-sm text-on-surface-variant">Learning Portal</p>
  </div>

  <nav class="flex-1 px-4 space-y-1">
    @for (item of navItems; track item.label) {
      <a
        [routerLink]="item.route"
        routerLinkActive="text-primary font-bold border-r-4 border-primary bg-surface-container-low"
        [routerLinkActiveOptions]="{ exact: item.route === '/' }"
        class="flex items-center gap-3 px-4 py-2.5 rounded-xl text-on-surface-variant hover:text-primary hover:bg-surface-container transition-all"
      >
        <span class="material-symbols-outlined">{{ item.icon }}</span>
        <span>{{ item.label }}</span>
      </a>
    }
  </nav>

  <div class="p-4 mb-4">
    <button
      type="button"
      (click)="themeService.toggle()"
      class="w-full flex items-center justify-center gap-2 py-2.5 px-4 rounded-xl border border-outline-variant text-on-surface-variant hover:border-primary hover:text-primary transition-all font-bold text-sm"
    >
      <span class="material-symbols-outlined text-[18px]">
        {{ themeService.theme() === 'dark' ? 'light_mode' : 'dark_mode' }}
      </span>
      {{ themeService.theme() === 'dark' ? 'Light mode' : 'Dark mode' }}
    </button>
  </div>
</aside>

<main class="ml-64 flex-1 flex flex-col min-h-screen relative">
  <header
    class="flex justify-between items-center w-full px-6 py-3 sticky top-0 z-50 bg-surface/80 backdrop-blur-md border-b border-surface-variant"
  >
    <div class="flex-1 max-w-md">
      <div class="relative">
        <span
          class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]"
          >search</span
        >
        <input
          class="w-full pl-10 pr-4 py-2 bg-surface-container rounded-full border-none focus:ring-2 focus:ring-primary transition-all text-sm"
          placeholder="Search documentation..."
          type="text"
        />
      </div>
    </div>
    <div class="flex items-center gap-4">
      <button
        type="button"
        class="p-2 text-on-surface-variant hover:text-primary transition-all"
      >
        <span class="material-symbols-outlined">notifications</span>
      </button>
      <div class="h-8 w-px bg-outline-variant"></div>
      <div class="flex items-center gap-2">
        <div class="text-right hidden sm:block">
          <p class="text-xs font-bold uppercase text-on-surface">Dev</p>
          <p class="text-[10px] text-outline">Level 42 Architect</p>
        </div>
        <div
          class="w-9 h-9 rounded-full border-2 border-primary-container bg-primary-container flex items-center justify-center text-on-primary-container text-sm font-bold"
        >
          D
        </div>
      </div>
    </div>
  </header>

  <div class="flex-1">
    <router-outlet></router-outlet>
  </div>

  <footer
    class="w-full flex flex-col md:flex-row justify-between items-center px-6 py-6 border-t border-surface-variant bg-surface-container-low gap-2"
  >
    <p class="text-sm text-secondary">
      &copy; 2026 DevHub Learning. Built for Engineers.
    </p>
    <div class="flex gap-4 text-sm text-on-surface-variant">
      <a class="hover:text-on-surface transition-colors" href="#">Documentation</a>
      <a class="hover:text-on-surface transition-colors" href="#">Privacy Policy</a>
      <a class="hover:text-on-surface transition-colors" href="#">Support</a>
    </div>
  </footer>
</main>
