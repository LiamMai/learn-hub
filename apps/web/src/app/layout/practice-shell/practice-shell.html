<div class="h-screen flex flex-col overflow-hidden">
  <header
    class="flex justify-between items-center w-full px-6 h-16 border-b border-outline-variant bg-surface-container-lowest z-10 shrink-0"
  >
    <h1 class="text-lg font-extrabold text-primary">DevHub</h1>
    <div class="relative w-full max-w-xs">
      <span
        class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[18px]"
        >search</span
      >
      <input
        class="w-full pl-9 pr-3 py-1.5 bg-surface-container rounded-full border-none focus:ring-2 focus:ring-primary transition-all text-sm"
        placeholder="Search documentation..."
        type="text"
      />
    </div>
    <button
      type="button"
      (click)="themeService.toggle()"
      class="p-2 text-on-surface-variant hover:text-primary transition-all"
    >
      <span class="material-symbols-outlined">
        {{ themeService.theme() === 'dark' ? 'light_mode' : 'dark_mode' }}
      </span>
    </button>
  </header>

  <div class="flex-1 flex overflow-hidden relative">
    <aside class="hidden md:flex flex-col w-64 border-r border-outline-variant bg-surface-container-lowest shrink-0">
      <nav class="flex-1 p-3 space-y-1">
        @for (item of navItems; track item.label) {
          <a
            [routerLink]="item.route"
            routerLinkActive="bg-secondary-container text-on-secondary-container font-bold"
            [routerLinkActiveOptions]="{ exact: item.route === '/' }"
            class="flex items-center gap-3 px-4 py-2.5 rounded-xl text-on-surface-variant transition-colors"
          >
            <span class="material-symbols-outlined">{{ item.icon }}</span>
            <span>{{ item.label }}</span>
          </a>
        }
      </nav>
    </aside>

    <div class="flex-1 overflow-hidden">
      <router-outlet></router-outlet>
    </div>
  </div>

  <nav
    class="md:hidden fixed bottom-0 left-0 right-0 h-16 bg-surface-container-lowest border-t border-outline-variant flex items-center justify-around z-50"
  >
    <a routerLink="/" class="flex flex-col items-center gap-0.5 text-xs text-on-surface-variant">
      <span class="material-symbols-outlined">home</span>
      Home
    </a>
    <a routerLink="/practice" class="flex flex-col items-center gap-0.5 text-xs text-primary">
      <span class="material-symbols-outlined">terminal</span>
      Practice
    </a>
    <a routerLink="/learn" class="flex flex-col items-center gap-0.5 text-xs text-on-surface-variant">
      <span class="material-symbols-outlined">school</span>
      Learn
    </a>
    <a routerLink="/coming-soon" class="flex flex-col items-center gap-0.5 text-xs text-on-surface-variant">
      <span class="material-symbols-outlined">person</span>
      Profile
    </a>
  </nav>
</div>
