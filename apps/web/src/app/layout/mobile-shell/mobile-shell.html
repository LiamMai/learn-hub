<header
  class="fixed top-0 w-full z-50 bg-surface-container-lowest shadow-sm flex justify-between items-center h-14 px-4"
>
  <div class="flex items-center gap-2">
    <button type="button" class="p-1">
      <span class="material-symbols-outlined">menu</span>
    </button>
    <span class="font-extrabold text-primary">DevHub</span>
  </div>
  <div
    class="w-9 h-9 rounded-full border-2 border-primary-container bg-primary-container flex items-center justify-center text-on-primary-container text-sm font-bold"
  >
    D
  </div>
</header>

<main class="pt-14 pb-24 max-w-md mx-auto">
  <router-outlet></router-outlet>
</main>

<nav
  class="fixed bottom-0 w-full z-50 bg-surface-container-lowest border-t border-outline-variant flex justify-around items-center h-16 rounded-t-xl"
>
  @for (item of navItems; track item.label) {
    <a
      [routerLink]="item.route"
      routerLinkActive="text-primary"
      class="flex flex-col items-center justify-center gap-0.5 text-xs text-on-surface-variant px-3 py-1.5 rounded-full transition-colors"
    >
      <span class="material-symbols-outlined text-[22px]">{{ item.icon }}</span>
      {{ item.label }}
    </a>
  }
</nav>
